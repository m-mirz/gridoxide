[package]
name = "gridoxide"
version = "0.0.2"
edition = "2024"
build = "build.rs"
# gridoxide's own code is Apache-2.0. `src/klu_native/` (always built, no
# feature gate) is a close Rust translation of vendored SuiteSparse C —
# BSD-3-Clause for the AMD-derived pieces, LGPL-2.1-or-later for the
# BTF/KLU-derived pieces — so every default build now bundles all three.
# See src/klu_native/PROVENANCE.md and docs/src/reference/provenance.md.
# (Building with `--features klu` additionally links the vendored C itself,
# already LGPL-2.1-or-later/BSD-3-Clause per vendor/suitesparse/PROVENANCE.md
# — no new license beyond what's already listed here.)
license = "Apache-2.0 AND BSD-3-Clause AND LGPL-2.1-or-later"

# "rlib" keeps the crate usable as a normal Rust dependency (examples/,
# tests/) exactly as before; "cdylib" is the loadable-by-Python extension
# module artifact maturin builds when the `python` feature is enabled — see
# that feature's doc comment below for why the two must never be built
# together in one `cargo` invocation.
# "staticlib" is for the `capi` feature: a C++ project linking gridoxide
# usually wants `libgridoxide.a` so the Rust runtime comes along in one
# artifact rather than as a second file to install. It costs nothing when the
# feature is off — cargo simply produces an archive nothing reads.
[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
faer = "0.24.4"
num-complex = { version = "0.4.6", features = ["serde"] }
# Powers `src/batch.rs`'s across-scenario parallelism. Not a new build cost:
# `faer` (and `gemm` beneath it) already pull rayon in, so this only promotes
# an existing transitive dependency to a direct one. Sharing rayon's pool
# rather than spawning raw OS threads is deliberate — it keeps any nested
# parallelism inside faer from oversubscribing the machine, and it means a
# batch never pays thread-creation cost per call.
rayon = "1.12"
# The IIDM importer's XML reader (`iidm` feature). Already present in the tree
# as a transitive dependency of `cimdecoder`, so enabling `iidm` adds nothing to
# a build that already has `cgmes` — this promotes it to a direct dependency the
# same way `rayon` was promoted for `src/batch.rs`.
quick-xml = { version = "0.37", optional = true }
pyo3 = { version = "0.29.0", features = ["extension-module"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Neither crate is published to crates.io, so this pins the `vendor/gridoxide`
# branch/tag of cimoxide (https://github.com/m-mirz/cimoxide) — a fork of
# `main` with its normally-gitignored generated sources committed, created
# specifically to make this dependency possible. See
# docs/src/reference/provenance.md.
cimdecoder = { git = "https://github.com/m-mirz/cimoxide", tag = "v0.1.1-gridoxide.1", optional = true }
cimstructs = { git = "https://github.com/m-mirz/cimoxide", tag = "v0.1.1-gridoxide.1", optional = true }

[build-dependencies]
cc = { version = "1.0", optional = true }
bindgen = { version = "0.72", optional = true }
# The outward-facing counterpart of `bindgen`: generates `include/gridoxide.h`
# from the `#[no_mangle]` surface in `src/capi/`. See the `capi` feature.
cbindgen = { version = "0.29", optional = true }

[features]
default = []
# Builds the vendored SuiteSparse KLU solver (vendor/suitesparse/) as a third,
# opt-in JacobianBackend — see docs/src/solvers/backends.md. Needs a
# C compiler and libclang (for bindgen) at build time. KLU and BTF (one of
# KLU's own dependencies) are LGPL-2.1-or-later — see
# vendor/suitesparse/PROVENANCE.md before enabling this in a distributed
# binary.
klu = ["dep:cc", "dep:bindgen"]
# Links a system-installed libklu.so instead of compiling the vendored
# source statically, for anyone who needs strict LGPL relinking compliance.
klu-dynamic = ["klu"]
# Builds `src/python.rs`'s PyO3 bindings (the `gridoxide` Python extension
# module — see scripts/bench/README.md and pyproject.toml). Only ever build
# this via `maturin` (`maturin develop --features python`), never as part of
# a plain `cargo build`/`cargo test` invocation alongside examples or test
# binaries: `pyo3`'s `extension-module` feature (needed so the built
# `cdylib` doesn't try to link against libpython itself, since Python will
# dlopen it and provide the symbols at runtime) makes a normal standalone
# binary/test harness fail to link, since *those* do need libpython linked
# in directly. This is a well-known, expected PyO3 constraint, not a
# gridoxide-specific issue.
python = ["dep:pyo3"]
# Builds a fifth, opt-in `JacobianBackend` (`Pardiso`) backed by Intel oneMKL's
# PARDISO sparse direct solver, linked dynamically against a locally-installed
# oneMKL (discovered via the `MKLROOT` env var — see
# docs/src/solvers/backends.md). Unlike `klu`, nothing is vendored or
# compiled from
# source: MKL is proprietary (Intel Simplified Software License, not OSS), so
# this only ever links a system install's `libmkl_rt.so` and generates FFI
# bindings via `bindgen` against that install's own `mkl_pardiso.h` — nothing
# MKL-derived is redistributed by this crate, so `Cargo.toml`'s `license`
# field doesn't need to change for this feature. Needs `libclang` (for
# `bindgen`) at build time, plus `MKLROOT` set (e.g. `source
# /opt/intel/oneapi/setvars.sh`). Not built or tested in CI — no CI runner
# has MKL installed — so this is a local/manual-verification-only backend.
pardiso = ["dep:bindgen"]
# Builds CGMES (Common Grid Model Exchange Standard) RDF/XML dataset support
# (src/cgmes.rs), converting a CGMES EQ+SSH+TP+SV profile set into gridoxide's
# own Bus/Line/Transformer model. Depends on cimoxide's cimdecoder/cimstructs
# crates via a pinned git tag — they aren't published to crates.io, see
# docs/src/reference/provenance.md. Opt-in since most gridoxide users only need
# PGM-JSON input and shouldn't pay for cimdecoder's own dependency tree or
# build time.
cgmes = ["dep:cimdecoder", "dep:cimstructs"]
# Reads UCTE-DEF network files (src/ucte.rs) — the fixed-column format the
# continental-European TSOs exchanged snapshots in before CGMES, and the one
# most published remedial-action test material is still written in.
#
# Unlike `cgmes` this pulls in **no dependency at all**: UCTE-DEF is plain
# fixed-column text, so the importer is pure `std`. It is therefore built and
# tested in CI, alongside `opf` and `capi` rather than alongside the
# system-library features.
#
# It is also the only importer that arrives carrying branch *ratings* and tap
# *tables* — see `src/ratings.rs` and `types::TapChanger` for why those two
# were the gap worth closing.
ucte = []
# Reads PowSyBl's IIDM network format (src/iidm.rs) — `.xiidm` files, the native
# serialization of powsybl-core's network model, and the second of the two
# formats the published remedial-action test material comes in.
#
# Deliberately **version-tolerant**: it accepts any `.../schema/iidm/1_*`
# namespace and skips elements it does not know rather than failing. The 51
# vendored fixtures span eleven schema versions (1_0 through 1_16) and the model
# moved underneath them — limits are spelled `currentLimits1` in the older files
# and `operationalLimitsGroup1` in the newer. A strict parser would rot against
# the next powsybl release; this one is designed not to.
#
# Costs one dependency (`quick-xml`) and no system library, so like `ucte` and
# `opf` it is built and tested in CI.
iidm = ["dep:quick-xml"]
# The remedial-action layer (src/rao/) — see plans/RAO_PLAN.md. At present the
# CRAC data model and its readers; the optimizer follows.
#
# Depends on `opf` for the `LinearProgram`/`Solver` boundary the range-action
# optimization is written against — not on any *backend*, so the default
# in-house interior-point solver serves and nothing needs installing. Built and
# tested in CI.
rao = ["opf"]
# The optimization layer, complete and self-contained: `opf::LinearProgram`,
# `opf::Solution` and the `opf::Solver` trait (src/opf/mod.rs), DC-OPF
# (src/opf/dc.rs), and the in-house primal-dual interior-point QP solver
# (src/opf/ipm.rs) that answers them. Pure Rust on this crate's own sparse
# factorization — no system libraries, no C toolchain, nothing to install — so
# unlike `klu`/`pardiso`/`opf-highs` this one *is* built and tested in CI.
#
# This is what `gridoxide opf` and the Python `dc_opf` need. `opf-highs` below
# is an optional second backend, not a requirement.
opf = []
# Builds the HiGHS backend for `opf` (src/opf/highs.rs). Like `pardiso`,
# nothing is vendored or compiled from source: this links a *system* HiGHS
# install and generates FFI bindings via `bindgen` against that install's own
# `highs_c_api.h`, so nothing HiGHS-derived is redistributed and
# `Cargo.toml`'s `license` field doesn't change (HiGHS is MIT in any case).
#
# Needs `libclang` (for `bindgen`) plus a local HiGHS with its development
# files — on Debian/Ubuntu that is `apt install libhighs-dev`. The install is
# found at `/usr` by default; set `HIGHS_ROOT` for anything else.
#
# Not built or tested in CI, since no runner has HiGHS installed — the same
# local/manual-verification-only position `pardiso` is in. Unlike `pardiso`,
# nothing depends on it: `opf`'s own interior-point solver is the default
# backend, and this one is the *reference* the two are cross-checked against in
# tests/opf_cross_test.rs. On a convex problem the optimum is unique, so a
# disagreement between them is a bug in one — which is a sharper signal than
# either could produce alone, and worth keeping the feature for even though it
# is no longer needed to solve anything.
opf-highs = ["opf", "dep:bindgen"]
# Builds the IPOPT backend for `opf`'s *nonlinear* solver (src/opf/ipopt.rs) —
# the AC-OPF counterpart of what `opf-highs` is for DC. Same arrangement again:
# nothing vendored, nothing compiled from source, bindings generated via
# `bindgen` against a *system* IPOPT's own `IpStdCInterface.h`.
#
# That arrangement is what keeps IPOPT's EPL-2.0 licence off this crate's
# `license` field. Nothing IPOPT-derived is redistributed here; the feature
# links a library the user installed, exactly as `pardiso` links a
# separately-licensed oneMKL. Enabling it in a *distributed binary* is the
# user's licensing decision, not this crate's.
#
# Needs `libclang` (for `bindgen`) plus a local IPOPT with its development
# files — on Debian/Ubuntu that is `apt install coinor-libipopt-dev`. Found at
# `/usr` by default; set `IPOPT_ROOT` for anything else.
#
# Not built or tested in CI, and nothing depends on it: `opf::nlp` is the
# default nonlinear solver and this is the *reference* the two are
# cross-checked against, the same role `opf-highs` plays for `opf::ipm`. On a
# nonconvex problem the two need not agree — they may find different local
# optima — which makes the comparison weaker than the convex one and worth
# reading carefully rather than as a pass/fail.
opf-ipopt = ["opf", "dep:bindgen"]
# Exports a C ABI (src/capi/) so a C++ project can embed gridoxide, plus the
# `cbindgen`-generated `include/gridoxide.h` that describes it.
#
# This is the **mirror image** of `klu`/`pardiso`/`opf-highs`/`opf-ipopt`.
# Those four consume a C header to reach a library; this one produces a C
# header so a library can reach us. `build.rs` gained a `capi` module shaped
# like its four siblings, but running cbindgen rather than bindgen.
#
# Unlike them it has **no system dependency** — pure Rust plus a build-time
# crate — so, like `opf`, it is built and tested in CI.
#
# **Never build this together with `python`.** `pyo3`'s `extension-module`
# deliberately leaves libpython unlinked, which is right for something Python
# dlopens and wrong for a library a C++ binary links directly; the two produce
# incompatible cdylibs from one `cargo` invocation. The same trap the `python`
# feature already documents for tests and examples.
capi = ["dep:cbindgen"]

