[package]
name = "gridoxide-gpu"
description = "gridoxide's batched AC power flow for NVIDIA GPUs: an adaptive Newton loop over cuDSS's uniform batch"
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "Apache-2.0"
# Not published until the cuDSS backend exists and has been measured; see
# plans/GPU_BATCH_PLAN.md.
publish = false

[dependencies]
gridoxide-core = { path = "../gridoxide-core", version = "0.1.0" }
gridoxide-sparse = { path = "../gridoxide-sparse", version = "0.1.0" }

[dev-dependencies]
# The tests and the counting example read MATPOWER cases through gridoxide's
# reader. A dev-dependency only: nothing in this library depends on gridoxide.
gridoxide = { path = "../..", features = ["matpower"] }

[build-dependencies]
bindgen = { version = "0.72", optional = true }

[features]
default = []
# The cuDSS backend, `CudssUniformBatch` (src/cudss.rs). Off by default so this
# crate, and the workspace, build and test without CUDA. Needs libclang (for
# bindgen), CUDSS_DIR and the CUDA 12 toolkit; build.rs says what each is.
# On a machine without CUDA it can still be type-checked against the probe's
# stub headers:
#   CUDSS_DIR=<cudss> CUDA_INCLUDE_DIR=$PWD/probes/cudss_ubatch/stub \
#     cargo check -p gridoxide-gpu --features cuda --all-targets
cuda = ["dep:bindgen"]
