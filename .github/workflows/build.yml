name: Rust build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    # No `--features klu`: this doesn't build/run the FFI-backed `Klu`
    # backend (needs a C compiler + libclang) or the differential tests in
    # `src/klu_native/` that compare its pure-Rust port against real
    # vendored KLU (`#[cfg(feature = "klu")]`-gated). klu_native's own
    # structural/dense-oracle tests and tests/klu_native_jacobian_test.rs
    # still run here, since that backend needs no C toolchain. Adding
    # `--features klu` here (a C-compiler + libclang runner dependency)
    # is a known follow-up, not done as part of the klu_native port itself.
    # No `--features pardiso` either, for the same reason plus one more:
    # the `Pardiso` backend (`src/sparse_pardiso.rs`) needs a locally
    # installed, separately-licensed Intel oneMKL (`MKLROOT` set) — not
    # available on GitHub-hosted runners at all, so this backend is
    # local/manual-verification-only (see
    # docs/src/solvers/backends.md).
    - name: Run tests
      run: cargo test --verbose
    # `opf` *is* built and tested here, unlike the backends above, because it
    # needs nothing installed: the interior-point QP solver in `src/opf/ipm.rs`
    # is pure Rust on this crate's own sparse factorization. That was the point
    # of writing it — before it existed the only backend was `opf-highs`, which
    # links a system HiGHS no runner has, so the entire OPF surface (DC-OPF,
    # the CLI subcommand, the Python binding) was invisible to CI.
    #
    # Still not built here: `opf-highs` itself, and with it
    # `tests/opf_cross_test.rs`, which holds the two backends against each
    # other. That gate runs where HiGHS is installed. Losing it in CI is the
    # accepted cost of not making a system library a CI dependency — what CI
    # does cover is the analytic battery in `tests/opf_ipm_test.rs` and the
    # published pglib objectives in `tests/opf_dc_test.rs`, neither of which
    # needs a second solver.
    - name: Build and test the optimization layer
      run: |
        cargo build --verbose --features opf
        cargo test --verbose --features opf
    # `ucte` is in CI for the same reason `opf` and `capi` are, and with less
    # excuse than either: UCTE-DEF is fixed-column text, so the importer pulls
    # in no dependency at all — not even a parser crate.
    #
    # What the suite checks is not that files parse. It is that the imported
    # network *solves to the same answer as pypowsybl*, against reference
    # solutions committed as JSON under `tests/data/ucte/`. Those were generated
    # once by `scripts/bench/ucte_reference.py`; the runner needs neither Python
    # nor pypowsybl to check them, which is the whole point of committing them.
    - name: Build and test the UCTE importer
      run: |
        cargo build --verbose --features ucte
        cargo test --verbose --features ucte
    # `iidm` costs one crate (quick-xml) and no system library, so it is in CI
    # alongside `ucte`. It is built together with `ucte` because its strongest
    # test needs both: three fixtures are pypowsybl exports of `.uct` files the
    # UCTE suite has already checked, so gridoxide reads the same network
    # through two parsers that share no code and the answers must agree.
    - name: Build and test the IIDM importer
      run: |
        cargo build --verbose --features iidm
        cargo test --verbose --features iidm,ucte
    # Feature *unification* is its own failure mode, and the steps above cannot
    # see it: each builds one feature at a time, while cargo builds whatever
    # combination a consumer asks for. `iidm` and `cgmes` share quick-xml, and
    # cimdecoder enables its `encoding` feature — which changes the shape of a
    # public type. That combination compiled in neither step above and broke in
    # the one nobody ran. This is that step.
    # `rao` is pure Rust on serde, which the crate already depends on.
    - name: Build and test the remedial-action layer
      run: |
        cargo build --verbose --features rao
        cargo test --verbose --features rao
        cargo test --verbose --features rao,ucte,iidm
    # The external gate: `tests/rao_cucumber_test.rs` runs scenarios copied
    # verbatim from powsybl-open-rao's own Cucumber suite and compares against
    # expectations its authors wrote. It needs no network access and no Java —
    # the scenarios, their CRACs and their parameter files are vendored — so it
    # is an ordinary test, and it is the only check here that gridoxide did not
    # write for itself.
    - name: Build the CI-covered features together
      run: cargo build --verbose --features cgmes,ucte,iidm,opf,rao
    # `capi` is built here for the same reason `opf` is: no system dependency.
    # It is pure Rust plus cbindgen, which cargo fetches like any other crate —
    # unlike klu/pardiso/opf-highs/opf-ipopt, which each need a library the
    # runner does not have.
    #
    # The two example programs are the part `cargo test` cannot cover. They are
    # what proves the generated header actually parses as C11 and C++17, that
    # the `#[repr(C)]` layouts agree with what a real compiler computes, and
    # that the exported symbols link — none of which a Rust test can check,
    # since it never sees the header at all.
    - name: Build and test the C ABI
      run: |
        cargo build --verbose --features capi
        cargo test --verbose --features capi
    - name: Compile and run the C and C++ examples
      run: |
        cargo build --release --features capi
        cc  -std=c11   -Wall -Wextra -Werror -Iinclude \
            capi/examples/powerflow.c   target/release/libgridoxide.a \
            -o /tmp/powerflow_c   -lpthread -ldl -lm
        c++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            capi/examples/powerflow.cpp target/release/libgridoxide.a \
            -o /tmp/powerflow_cpp -lpthread -ldl -lm
        /tmp/powerflow_c   tests/data/pglib-opf/pglib_opf_case14_ieee.json
        /tmp/powerflow_cpp tests/data/pglib-opf/pglib_opf_case14_ieee.json
    # The header is committed so a prebuilt-artifact consumer needs no Rust
    # toolchain. Nothing keeps it in step with the code unless something checks,
    # and `cargo build --features capi` regenerates it — so a diff here means a
    # contributor changed the ABI without committing the regenerated header.
    - name: Check the committed header is not stale
      run: git diff --exit-code -- include/gridoxide.h
